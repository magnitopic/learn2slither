game:
    screen:
        size_px: 900
        show_stats: true # show stats panel (bonus)
        show_grid: true # show grid lines

        colour:
            snake: [125, 100, 225]
            apple_green: "#00FF00"
            apple_red: "#FF0000"
            button: [125, 100, 225]
            bg: [240, 240, 230]

    snake:
        initial_length: 3
        show_vision: true # Visualize the snake's POV in terminal

    board:
        step_by_step: false
        size: 10 # Playable area. Recommended range [6-20+] (bonus)
        num_green_apples: 2
        num_red_apples: 1
        visual: true # show the game in a window

ai:
    training:
        sessions: 100000 # number of sessions to train the AI
        max_steps: 1000 # max steps per session, prevents infinite loops
        target_avg_len: 35 # Length of snake we want to achieve (bonus)

    model:
        input_size: 16
        hidden_sizes: [128, 64]
        output_size: 3
        activation: "relu"

    agent:
        # Hyperparameters for learning
        learning_rate: 0.01
        gamma: 0.9

        # Exploration vs Exploitation parameters
        epsilon_start: 0.9
        epsilon_end: 0.01
        epsilon_decay: 0.9999

        # Memory parameters
        batch_size: 64
        memory_size: 10000

        # Extra
        target_update_frequency: 100
        use_double_dqn: true

    rewards:
        green_apple: 10
        red_apple: -5
        death: -100
        stop: 0.1

        use_distance_rewards: true
        closer_to_apple: 1
        farther_to_apple: -1
