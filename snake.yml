game:
    screen:
        size_px: 900
        show_stats: true
        show_grid: true

        colour:
            snake: [125, 100, 225]
            apple_green: "#00FF00"
            apple_red: "#FF0000"
            bg: [240, 240, 230]

    snake:
        initial_length: 3
        show_vision: true # Visualize the snake's POV in terminal

    board:
        size: 10 # Playable area. Recommended range [6-20+]
        num_green_apples: 2
        num_red_apples: 1

ai:
    model:
        activation: "relu"

    agent:
        learning_rate: 0.01

    rewards:
        green_apple: 10
        red_apple: -10
        death: -100
        stop: 0.1

        use_distance_rewards: true
        closer_to_apple: 1
        farther_to_apple: -1

    training:
        max_steps: 1000
        target_avg_len: 35
