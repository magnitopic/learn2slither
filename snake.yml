game:
    max_steps: 1000
    human_player: true

    screen:
        size_px: 900
        show_stats: true
        show_grid: true

        colour:
            snake: [125, 100, 225]
            apple_green: "#00FF00"
            apple_red: "#FF0000"
            bg: [240, 240, 230]

    snake:
        initial_length: 3
        show_vision: true # Visualize the snake's POV in terminal

    board:
        size: 10 # Playable area. Recommended range [6-20+]
        num_green_apples: 2
        num_red_apples: 1
